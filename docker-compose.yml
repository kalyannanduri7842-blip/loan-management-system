version: '3.8'

services:
  loan-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalyan-loan-core
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_PATH=/app/backend/data/loan_db.json
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1));"]
      interval: 15s
      timeout: 5s
      retries: 3
